<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../src/styles.css"><style>body{margin:0;background:#eef2f7}.modal-backdrop{display:grid}.icon-button{font-size:24px}</style></head><body>
<div class="modal-backdrop"><section class="modal-card modal-wide modal-mobile-fullscreen modal-with-footer proposal-modal">
<header class="modal-header"><h2>计划调整预览</h2><button class="icon-button" aria-label="关闭">×</button></header>
<div class="modal-body"><div class="proposal-dialog-shell">
<section class="proposal-event proposal-event-local">
<div class="proposal-event-heading"><span class="proposal-event-kicker">本次操作</span><strong>调整任务组：默写</strong></div>
<p>预览移除 2 项尚未开始且无记录的任务。任务组信息发生变化。</p>
<div class="proposal-local-principle"><strong>只执行本次调整</strong><span>其他任务保持不变，计划原有问题暂不处理。</span></div>
</section>
<section class="proposal-local-result"><header><div><span>本次结果</span><strong>保存任务组调整</strong></div><em>可以直接保存</em></header>
<div class="proposal-local-result-grid"><button><strong>2</strong><span>移除任务</span></button><button disabled><strong>0</strong><span>移动其他任务</span></button><button disabled><strong>0</strong><span>影响其他日期</span></button><button disabled class="success"><strong>0</strong><span>新增或恶化问题</span></button></div>
<p>计划原有 5 个问题；其余不影响本次保存。</p></section>
<div class="proposal-local-alternatives"><div><strong>需要同时处理计划原有问题？</strong><span>当前保存只完成本次操作；查看其他方案后，才会扩大调整范围。</span></div><button class="text-button">查看其他方案</button></div>
<div class="proposal-details proposal-details-compact-local"><details><summary>字段与结构前后变化（3）</summary></details><details><summary>计算依据与稳定性（100%）</summary></details></div>
</div></div>
<footer class="modal-footer"><div class="proposal-footer-actions"><button class="proposal-cancel-action">取消</button><button class="primary-button">保存任务组调整</button></div></footer>
</section></div></body></html>
