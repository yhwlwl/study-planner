name: temporary final-final tutorial e2e

on:
  push:
    branches:
      - agent/visitor-attribution-funnel-analytics

jobs:
  export:
    if: github.event.head_commit.message == '临时导出教程最终浏览器回归包'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: tutorial-final-browser-dist
          path: dist
          retention-days: 1
