name: one-shot-analytics-version-sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-one-shot-analytics-version-sync.yml'

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 统一分析模块版本来源
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/analytics.ts')
          text = path.read_text()
          old = "const APP_VERSION = '0.9.0'"
          new = "import { APP_VERSION } from './constants'"
          if text.count(old) != 1:
              raise SystemExit(f'analytics.ts: expected one legacy APP_VERSION, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -q "import { APP_VERSION } from './constants'" src/lib/analytics.ts
          ! grep -q "const APP_VERSION = '0.9.0'" src/lib/analytics.ts
      - name: 安装依赖
        run: npm ci
      - name: 完整质量验证
        run: npm run test:quality
      - name: 提交版本一致性修复
        shell: bash
        run: |
          rm .github/workflows/zz-one-shot-analytics-version-sync.yml
          git config user.name 'study-planner-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: 统一分析埋点版本号'
          git push origin HEAD:main
