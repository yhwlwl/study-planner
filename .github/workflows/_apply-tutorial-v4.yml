name: temporary apply tutorial v4 audit patch
on:
  push:
    branches:
      - agent/tutorial-guided-flow-v2
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message == '临时应用教程v4审计补丁'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/tutorial-guided-flow-v2
      - name: Rebuild clean tutorial commit
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard 7cdf8a3587b30ae8ffe40243035c0dd2746dc4eb
          git clean -fd
          cat > /tmp/tutorial-v4.patch.gz.b64 <<'PATCH64'
[... ELLIPSIZATION ...]
PATCH64
          base64 -d /tmp/tutorial-v4.patch.gz.b64 | gzip -d > /tmp/tutorial-v4.patch
          git apply --index /tmp/tutorial-v4.patch
          git config user.name 'yhwlwl'
          git config user.email 'steelpilot@hotmail.com'
          git commit -m '补齐教程21步流程并完善移动端引导'
          git push --force origin HEAD:agent/tutorial-guided-flow-v2
