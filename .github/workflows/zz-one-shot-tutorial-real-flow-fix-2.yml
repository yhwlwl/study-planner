name: one-shot-tutorial-real-flow-fix-2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-one-shot-tutorial-real-flow-fix-2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 应用修复
        shell: bash
        run: |
          python scripts/one-shot-tutorial-fix.py
          sed -i '1i // @vitest-environment jsdom' tests/modal.test.tsx
      - name: 安装依赖
        run: npm ci
      - name: 完整质量验证
        run: npm run test:quality
      - name: 提交修复
        shell: bash
        run: |
          rm .github/workflows/zz-one-shot-tutorial-real-flow-fix.yml
          rm .github/workflows/zz-one-shot-tutorial-real-flow-fix-2.yml
          rm scripts/one-shot-tutorial-fix.py
          git config user.name 'study-planner-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: 修正教程真实流程与移动端滚动'
          git push origin HEAD:main
