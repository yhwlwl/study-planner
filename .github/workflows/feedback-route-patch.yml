name: Apply feedback route patch

on:
  push:
    branches:
      - agent/feedback-submissions

permissions:
  contents: write

jobs:
  patch-app:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/feedback-submissions
      - name: Patch App.tsx
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/App.tsx')
          text = path.read_text()
          replacements = [
              (
                  "const ExportPage = lazy(() => import('./components/ExportPage').then(module => ({ default: module.ExportPage })))\n",
                  "const ExportPage = lazy(() => import('./components/ExportPage').then(module => ({ default: module.ExportPage })))\nconst FeedbackPage = lazy(() => import('./components/FeedbackPage').then(module => ({ default: module.FeedbackPage })))\n",
              ),
              (
                  "type Page = 'today' | 'calendar' | 'tasks' | 'intake' | 'goals' | 'stats' | 'export' | 'guide' | 'settings' | 'timer'",
                  "type Page = 'today' | 'calendar' | 'tasks' | 'intake' | 'goals' | 'stats' | 'export' | 'feedback' | 'guide' | 'settings' | 'timer'",
              ),
              (
                  "  { id: 'export', label: '导出', icon: FileDown },\n  { id: 'guide', label: '使用教程', icon: BookOpen },",
                  "  { id: 'export', label: '导出', icon: FileDown },\n  { id: 'feedback', label: '意见反馈', icon: Inbox },\n  { id: 'guide', label: '使用教程', icon: BookOpen },",
              ),
              (
                  "const tutorialReturnPage = (value: Page): TutorialSession['returnPage'] => value === 'timer' ? 'today' : value",
                  "const tutorialReturnPage = (value: Page): TutorialSession['returnPage'] => value === 'timer' || value === 'feedback' ? 'today' : value",
              ),
              (
                  "            {page === 'export' && <ExportPage onNavigate={target => navigate(target)}/>}\n            {page === 'guide' && <GuidePage onNavigate={target => navigate(target)} onStartTutorial={() => setTutorialOfferOpen(true)}/>}\n",
                  "            {page === 'export' && <ExportPage onNavigate={target => navigate(target)}/>}\n            {page === 'feedback' && <FeedbackPage/>}\n            {page === 'guide' && <GuidePage onNavigate={target => navigate(target)} onStartTutorial={() => setTutorialOfferOpen(true)}/>}\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          Path('.github/workflows/feedback-route-patch.yml').unlink()
          PY
      - name: Commit route integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx .github/workflows/feedback-route-patch.yml
          git commit -m "feat: 在侧边栏接入意见反馈"
          git push origin HEAD:agent/feedback-submissions
