name: one-shot-version-bump-091

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zz-one-shot-version-bump-091.yml'

permissions:
  contents: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 更新应用版本
        shell: bash
        run: |
          npm version 0.9.1 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/constants.ts')
          text = path.read_text()
          old = "export const APP_VERSION = '0.9.0'"
          new = "export const APP_VERSION = '0.9.1'"
          if text.count(old) != 1:
              raise SystemExit(f'constants.ts: expected one old version, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          grep -q '"version": "0.9.1"' package.json
          test "$(grep -c '"version": "0.9.1"' package-lock.json)" -ge 2
          grep -q "APP_VERSION = '0.9.1'" src/lib/constants.ts
      - name: 安装依赖
        run: npm ci
      - name: 完整质量验证
        run: npm run test:quality
      - name: 提交版本更新
        shell: bash
        run: |
          rm .github/workflows/zz-one-shot-version-bump-091.yml
          git config user.name 'study-planner-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'chore: 更新版本号至 0.9.1'
          git push origin HEAD:main
